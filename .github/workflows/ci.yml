name: Checks

on:
  push:
  pull_request:

jobs:
  database:
    name: Database rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Run database security tests
        run: bash supabase/tests/run.sh

  app:
    name: App build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_TELEMETRY_DISABLED: "1"
      FORCE_COLOR: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build (includes type check)
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Report the end of the log as an annotation so it shows on the check itself.
            msg=$(tail -n 80 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build failed::${msg}"
          fi
          exit $status

  pdf:
    name: PDF samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build sample PDFs
        run: |
          npx tsx scripts/pdf-sample.ts approved sample.pdf
          npx tsx scripts/pdf-sample.ts draft sample-draft.pdf
          npx tsx scripts/pdf-sample.ts po sample-po.pdf
          npx tsx scripts/pdf-sample.ts srfq sample-srfq.pdf
          npx tsx scripts/pdf-sample.ts dn sample-dn.pdf
          npx tsx scripts/pdf-sample.ts invoice sample-inv.pdf
          npx tsx scripts/pdf-sample.ts receipt sample-rct.pdf
      - name: Render page previews
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          pdfinfo sample.pdf | grep Pages
          pdftoppm -r 40 -jpeg -jpegopt quality=45 sample.pdf page
          pdftoppm -r 36 -f 1 -l 1 -jpeg -jpegopt quality=40 sample-draft.pdf draft
          pdftoppm -r 40 -f 1 -l 1 -jpeg -jpegopt quality=45 sample-po.pdf po
          pdftoppm -r 36 -f 1 -l 1 -jpeg -jpegopt quality=40 sample-srfq.pdf srfq
          pdftoppm -r 40 -f 1 -l 1 -jpeg -jpegopt quality=45 sample-dn.pdf dn
          pdftoppm -r 40 -f 1 -l 1 -jpeg -jpegopt quality=45 sample-inv.pdf inv
          pdftoppm -r 36 -f 1 -l 1 -jpeg -jpegopt quality=40 sample-rct.pdf rct
          ls -la *.jpg
      - name: Preview page 1
        run: bash scripts/emit-preview.sh page-1.jpg
      - name: Preview invoice
        run: bash scripts/emit-preview.sh inv-1.jpg
      - name: Preview receipt
        run: bash scripts/emit-preview.sh rct-1.jpg
