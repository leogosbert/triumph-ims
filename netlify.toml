# Netlify settings. Netlify detects Next.js and adds its Next.js runtime
# automatically, so server pages, sign-in and middleware all work.
[build]
  command = "npm run build"
  publish = ".next"
  # The company website in website/ is a separate Netlify project: a change only there does not rebuild the app.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)website'"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# The service worker must be re-checked on every start so app updates reach installed phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
